[project]
name = "atlas-agent-platform"
version = "0.1.0"
description = "A platform for building, running, evaluating, and governing enterprise AI agents."
readme = "README.md"
authors = [
    { name = "z5569348", email = "z5569348@ad.unsw.edu.au" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "openai>=3.13.0",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
atlas-agent-platform = "atlas_agent_platform:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
